
<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1><span class="material-symbols-outlined">library_music</span> Plataforma Musical</h1>
    </header>

    <main>
        <nav>
            <h2>Menú</h2>
            <ul>
                <li><a href="Index.html"><span class="material-symbols-outlined">home</span> Home</a></li>
                <li><a href="disco.html" class="active"><span class="material-symbols-outlined">album</span> Disco</a></li>
                <li><a href="cantante.html"><span class="material-symbols-outlined">person</span> Cantante</a></li>
                <li><a href="cancion.html"><span class="material-symbols-outlined">music_note</span> Canción</a></li>
                <li><a href="playlist.html"><span class="material-symbols-outlined">queue_music</span> Playlist</a></li>
            </ul>
        </nav>

        <section>
            <article>
                <h2>Registro de Disco</h2>
                <form id="form-disco">
                    <p>
                        <label for="disco-nombre">Nombre:</label>
                        <input type="text" id="disco-nombre" required>
                    </p>
                    <p>
                        <label for="disco-genero">Género:</label>
                        <input type="text" id="disco-genero" required>
                    </p>
                    <p>
                        <label for="disco-artista">Artista:</label>
                        <input type="text" id="disco-artista" required>
                    </p>
                    <p>
                        <label for="disco-portada">Portada:</label>
                        <input type="file" id="disco-portada" accept="image/*">
                    </p>
                    <button type="submit"><span class="material-symbols-outlined">save</span> Guardar Disco</button>
                </form>
                <section class="resultado" id="res-disco"></section>
            </article>
        </section>
    </main>

    <footer>
        <p><strong>Grupo:</strong> LDSM401 | <strong>Alumno:</strong> Arturo</p>
    </footer>

    <script src="script.js"></script>
