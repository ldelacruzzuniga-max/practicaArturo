<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Canción</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1><span class="material-symbols-outlined">library_music</span> Plataforma Musical</h1>
    </header>

    <main>
        <nav>
            <h2>Menú</h2>
            <ul>
                <li><a href="Index.html"><span class="material-symbols-outlined">home</span> Home</a></li>
                <li><a href="disco.html"><span class="material-symbols-outlined">album</span> Disco</a></li>
                <li><a href="cantante.html"><span class="material-symbols-outlined">person</span> Cantante</a></li>
                <li><a href="cancion.html" class="active"><span class="material-symbols-outlined">music_note</span> Canción</a></li>
                <li><a href="playlist.html"><span class="material-symbols-outlined">queue_music</span> Playlist</a></li>
            </ul>
        </nav>

        <section>
            <article>
                <h2>Registro de Canción</h2>
                <form id="form-cancion">
                    <p>
                        <label for="cancion-nombre">Nombre:</label>
                        <input type="text" id="cancion-nombre" required>
                    </p>
                    <p>
                        <label for="cancion-duracion">Duración:</label>
                        <input type="text" id="cancion-duracion" placeholder="mm:ss" required>
                    </p>
                    <p>
                        <label for="cancion-compositor">Compositor:</label>
                        <input type="text" id="cancion-compositor" required>
                    </p>
                    <p>
                        <label for="cancion-cantante">Cantante:</label>
                        <select id="cancion-cantante" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="Artista 1">Artista 1</option>
                            <option value="Artista 2">Artista 2</option>
                        </select>
                    </p>
                    <button type="submit"><span class="material-symbols-outlined">library_add</span> Guardar Canción</button>
                </form>
                <section class="resultado" id="res-cancion"></section>
            </article>
        </section>
    </main>

    <footer>
        <p><strong>Grupo:</strong> 4°A | <strong>Alumno:</strong> Arturo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
